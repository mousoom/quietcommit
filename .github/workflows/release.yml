name: release

# Publishes to npm when a v* tag is pushed, using npm OIDC Trusted Publishing
# (no NPM_TOKEN, no 2FA prompt). One-time setup on npmjs.com:
#   quietcommit → Settings → Trusted Publisher → GitHub Actions
#     repository: mousoom/quietcommit
#     workflow:   release.yml
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
